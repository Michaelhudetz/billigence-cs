example_queries:
  - id: rank_lookup
    question: Which university ranks 2nd in 2015?
    sql: |
      SELECT university_name, rank, guardian_score, dq_note
      FROM clean.overall_ranking
      WHERE year = 2015 AND rank = 2
  - id: nth_by_metric
    question: Which university is 2nd for teaching satisfaction in 2015?
    sql: |
      WITH ranked AS (
        SELECT university_name, nss_teaching, dq_note,
               RANK() OVER (ORDER BY nss_teaching DESC) AS metric_rank
        FROM clean.overall_ranking
        WHERE year = 2015 AND nss_teaching IS NOT NULL
      )
      SELECT university_name, nss_teaching, metric_rank, dq_note
      FROM ranked
      WHERE metric_rank = 2
  - id: best_lower_is_better
    question: Which university has the best student to staff ratio in 2015?
    sql: |
      WITH ranked AS (
        SELECT university_name, student_staff_ratio, dq_note,
               RANK() OVER (ORDER BY student_staff_ratio ASC) AS metric_rank
        FROM clean.overall_ranking
        WHERE year = 2015 AND student_staff_ratio IS NOT NULL
      )
      SELECT university_name, student_staff_ratio, metric_rank, dq_note
      FROM ranked
      WHERE metric_rank = 1
  - id: most_improved
    question: Which university improved the most between 2014 and 2015?
    sql: |
      WITH ranked AS (
        SELECT university_name, rank, prev_rank, places_climbed, prev_rank_source, dq_note,
               RANK() OVER (ORDER BY places_climbed DESC) AS metric_rank
        FROM clean.overall_ranking
        WHERE year = 2015 AND places_climbed IS NOT NULL
      )
      SELECT university_name, rank, prev_rank, places_climbed, prev_rank_source, dq_note
      FROM ranked
      WHERE metric_rank = 1
  - id: group_comparison
    question: How did Oxbridge do in 2015?
    sql: |
      SELECT university_name, rank, guardian_score, dq_note
      FROM clean.overall_ranking
      WHERE year = 2015 AND university_id IN ('oxford', 'cambridge')
      ORDER BY rank
  - id: subject_top_n
    question: Top 5 universities for Computer Science in 2015
    sql: |
      SELECT university_name, subject_name, rank, guardian_score, dq_note
      FROM clean.subject_ranking
      WHERE year = 2015 AND subject_id = 'computer_science_and_information_systems' AND rank <= 5
      ORDER BY rank, university_name
